version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: beatwave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beatwave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beatwave_secret}
      POSTGRES_DB: ${POSTGRES_DB:-beatwave}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beatwave} -d ${POSTGRES_DB:-beatwave}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: beatwave-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beatwave-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-beatwave}:${POSTGRES_PASSWORD:-beatwave_secret}@postgres:5432/${POSTGRES_DB:-beatwave}
      - REDIS_URL=redis://redis:6379/0

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: beatwave-bot
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://backend:8000/api/v1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beatwave-frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: beatwave-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
